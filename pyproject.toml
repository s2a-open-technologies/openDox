[project]
name = "project-red"
version = "0.8.3"
description = "Medical transcription platform with FastAPI backend and React frontend"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Christopher Abanilla", email = "christopher.abanilla@gmx.de"},
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "boto3>=1.35.0",
    "fastapi==0.141.1",
    "langchain==1.4.2",
    "langchain-openai==1.6.6",
    "ldap3==2.9.1",
    "numpy==2.5.3",
    "cryptography==50.0.1",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.13",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "ruff==0.16.9",
    "sqlmodel==0.0.47",
    "uvicorn[standard]==0.54.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "distro==1.9.0",
    "ecdsa==0.19.2",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.20",
    "jiter==0.17.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-core==1.6.5",
    "langchain-protocol==0.0.19",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.5",
    "langsmith==0.14.1",
    "mako==1.4.3",
    "markupsafe==3.0.3",
    "openai==3.19.2",
    "orjson==3.12.0",
    "ormsgpack==1.12.2",
    "packaging==26.3",
    "pyasn1==0.6.4",
    "pycparser==3.0",
    "pydantic-core==2.49.0",
    "pyyaml==6.0.3",
    "regex==2026.9.10",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "rsa==4.9.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.1.1",
    "starlette==1.7.0",
    "tenacity==9.1.4",
    "tiktoken==0.14.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
    "uuid-utils==1.0.0",
    "uvloop==0.22.1",
    "watchfiles==1.3.0",
    "websockets==17.1",
    "xxhash==4.0.1",
    "zstandard==0.25.0",
    "itsdangerous>=2.2.0",
    "pytest>=9.1.1",
    "pip-licenses>=5.0.0",
    "reuse>=5.0.0",
    "rapidfuzz>=3.14.6",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = false

[tool.ruff]
# Setze die maximale Zeilenlänge
line-length = 88

[tool.ruff.lint]
# Wähle die Regeln aus:
# E/F = Pyflakes/Pycodestyle (Standard PEP8)
# I = Isort (Import-Sortierung)
# D = Pydocstyle (Docstrings)
select = ["E", "F", "I", "D"]
ignore = [
    "D107", # Optional: Wenn du __init__ nicht immer dokumentieren willst
    # Der SPDX-Lizenzheader am Dateianfang wird als Modul-Docstring
    # fehlinterpretiert; D-Regeln für Rechtstext sind Rauschen.
    "D205",
    "D415",
    # Lizenzheader + eigener Modul-Docstring führen zu doppelten
    # Docstring-Blöcken und damit zu E402-Treffern bei den Imports.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Test-Klassen/-Funktionen sind selbstdokumentierend.
"tests/**" = ["D101", "D102", "D103"]
# Alembic-Migrationen sind (teil-)autogeneriert; Docstrings/Länge dort
# sind Rauschen. Lange Prompt-Strings lassen sich nicht sinnvoll umbrechen.
"alembic/versions/**" = ["D101", "D102", "D103", "E501"]

# Konfiguration der Import-Sortierung
[tool.ruff.lint.isort]
# Definiere die Reihenfolge deiner Imports
known-first-party = ["dein_projektname"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Konfiguration für Google-Style Docstrings
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Ruff übernimmt hier die Arbeit von Black
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
