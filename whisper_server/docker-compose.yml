
services:
  whisper:
    image: registry.nutsolution.de/opendox-whisper:latest
    build:
      context: .
      dockerfile: whisper_server/Dockerfile
    ports:
      - "5002:5002"
    container_name: opendox-whisper
    restart: always
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-loc-123}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper-data:
