services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: opendox-postgres
    #restart: always
    environment:
      POSTGRES_USER: ${SQL_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PASS:-postgres}
      POSTGRES_DB: ${SQL_DB:-opendox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-postgres} -d ${SQL_DB:-opendox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════════
  # Redis (Session Store)
  # ═══════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: opendox-redis
    #restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════════
  # Whisper Server (OpenAI-compatible API for transcription)
  # ═══════════════════════════════════════════════════════════════════════════════
  whisper:
    build:
      context: .
      dockerfile: whisper_server/Dockerfile
    container_name: opendox-whisper
    restart: always
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-loc-123}
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════════════════════════
  # Parakeet Server (CPU, onnx-asr, OpenAI-compatible API for live ASR)
  # ═══════════════════════════════════════════════════════════════════════════════
  parakeet:
    build: 
      context: .
      dockerfile: parakeet_server/Dockerfile
    container_name: opendox-parakeet
    restart: always

  # ═══════════════════════════════════════════════════════════════════════════════
  # openDox Application (FastAPI + React)
  # ═══════════════════════════════════════════════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opendox-app
    restart: always
    ports:
      - "${APP_PORT:-20000}:5000"
    environment:
      # Database (service name as host inside Docker network)
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASS: ${SQL_PASS:-postgres}
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DB: ${SQL_DB:-opendox}
      # Database URI override (optional, bypasses SQL_* above)
      DATABASE_URI: ${DATABASE_URI:-}
      # Security / Auth
      SECRET_KEY: ${SECRET_KEY:-ChangeThisInProduction}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Field Encryption (DSGVO / § 203 StGB)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Redis Session Store
      REDIS_URL: redis://redis:6379/0
      # Whisper API (point to the whisper container — used for final transcription)
      WHISPER_API_ENDPOINT: http://whisper:9000/v1
      WHISPER_API_KEY: ${WHISPER_API_KEY:-loc-123}
      # Parakeet API (CPU, used for live transcription)
      PARAKEET_API_ENDPOINT: http://parakeet:5001/v1
      # Root path for sub-path deployment (e.g. /app)
      ROOT_PATH: ${ROOT_PATH:-}
    volumes:
      - app-logs:/app/logs
      - app-chunks:/app/chunks
      - app-models-cache:/app/models_cache
      - app-certs:/app/certs
    extra_hosts:
      - "host.docker.internal:docker-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_started

volumes:
  postgres-data:
    name: opendox-postgres-data
  redis-data:
    name: opendox-redis-data
  whisper-data:
    name: opendox-whisper-data
  app-logs:
    name: opendox-app-logs
  app-chunks:
    name: opendox-app-chunks
  app-models-cache:
    name: opendox-app-models-cache
  app-certs:
    name: opendox-app-certs
