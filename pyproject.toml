[project]
name = "project-red"
version = "0.1.0"
description = "Medical transcription platform with FastAPI backend and React frontend"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Christopher Abanilla", email = "christopher.abanilla@gmx.de"},
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.2",
    "fastapi>=0.122.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.7",
    "ldap3>=2.9.1",
    "numpy>=2.3.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.21",
    "ruff>=0.15.16",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.38.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = false

[tool.ruff]
# Setze die maximale Zeilenlänge
line-length = 88

[tool.ruff.lint]
# Wähle die Regeln aus:
# E/F = Pyflakes/Pycodestyle (Standard PEP8)
# I = Isort (Import-Sortierung)
# D = Pydocstyle (Docstrings)
select = ["E", "F", "I", "D"]
ignore = ["D107"] # Optional: Wenn du __init__ nicht immer dokumentieren willst

# Konfiguration der Import-Sortierung
[tool.ruff.lint.isort]
# Definiere die Reihenfolge deiner Imports
known-first-party = ["dein_projektname"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Konfiguration für Google-Style Docstrings
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Ruff übernimmt hier die Arbeit von Black
quote-style = "double"
indent-style = "space"
