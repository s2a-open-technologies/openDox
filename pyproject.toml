name = "project-red"
version = "0.1.0"
description = "Medical transcription platform with FastAPI backend and React frontend"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Christopher Abanilla", email = "christopher.abanilla@gmx.de"},
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.3",
    "langchain==1.3.4",
    "langchain-openai==1.2.2",
    "ldap3==2.9.1",
    "numpy==2.4.6",
    "cryptography==48.0.1",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.31",
    "redis==8.0.1",
    "ruff==0.15.16",
    "sqlmodel==0.0.38",
    "uvicorn[standard]==0.49.0",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.5.20",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "distro==1.9.0",
    "ecdsa==0.19.2",
    "greenlet==3.5.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.18",
    "jiter==0.15.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-core==1.4.0",
    "langchain-protocol==0.0.16",
    "langgraph==1.2.4",
    "langgraph-checkpoint==4.1.1",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.2",
    "langsmith==0.8.9",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "openai==2.41.0",
    "orjson==3.11.9",
    "ormsgpack==1.12.2",
    "packaging==26.2",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pydantic-core==2.46.4",
    "pyyaml==6.0.3",
    "regex==2026.5.9",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "rsa==4.9.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.50",
    "starlette==1.2.1",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "uuid-utils==0.16.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==15.0.1",
    "xxhash==3.7.0",
    "zstandard==0.25.0",
    "itsdangerous>=2.2.0",
    "pytest>=9.1.1",
