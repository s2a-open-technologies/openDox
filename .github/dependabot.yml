version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-dev:
        dependency-type: development
      pip-prod:
        dependency-type: production
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /parakeet_server
    schedule:
      interval: weekly
    groups:
      parakeet:
        patterns:
          - "*"
    ignore:
      # onnxruntime-gpu 1.30+ ships no linux/aarch64 wheels, which breaks the
      # arm64 half of the multi-arch GPU image (see AGENTS.md gotchas).
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.30.0"]
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /whisper_server
    schedule:
      interval: weekly
    groups:
      whisper:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
      npm-prod:
        dependency-type: production
    ignore:
      # Majors (React 19, react-router 7, ESLint 10, Tailwind 4, TypeScript 7 ...)
      # are migrations, not routine updates. Do them by hand, one at a time.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Only LTS Node majors (even numbers) are acceptable for the frontend build.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3