services:
  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper
    restart: always
    ports:
      - "9100:9000/tcp"
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
    - WHISPER_MODEL=large-v3-turbo
    - WHISPER_DEVICE=cuda
    - WHISPER_API_KEY=loc-123
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper-data:
    name: whisper-data