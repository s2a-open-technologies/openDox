name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract CHANGELOG section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version" \
              "(expected a '## [$version]' heading — see scripts/bump_version.py)"
            exit 1
          fi

      # The manuals ship with every release. A failing build fails the
      # release on purpose, so no version goes out without its manual.
      # Pandoc and Typst run as Docker images; ImageMagick draws placeholders
      # for screenshots that don't exist yet.
      - name: Build user manuals (PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          OPENDOX_VERSION="${GITHUB_REF_NAME#v}" FORMATS=pdf scripts/build_handbuch.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            build/handbuch/*.pdf
