# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Bulk (REUSE.software "aggregate") licensing declarations for paths that
# deliberately don't carry a per-file header: thin test modules, generated
# Alembic migrations, lockfiles, and assorted project config/docs where a
# 16-line legal comment would be pure noise. Actual source code (.py, .ts,
# .tsx, .css, Dockerfiles) carries real per-file SPDX tags instead — see
# scripts/add_spdx_headers.py. Run `reuse lint` after adding new paths that
# don't fit either bucket.

[[annotations]]
path = ["tests/**", "alembic/versions/**", "alembic/README", "alembic/script.py.mako"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Christopher Abanilla <christopher.abanilla@gmx.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["uv.lock", "frontend/package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Christopher Abanilla <christopher.abanilla@gmx.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  "README.md",
  "docs/**",
  ".agents/AGENTS.md",
  "AUTHORS",
  "DISCLAIMER.md",
  "THIRD_PARTY_NOTICES.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Christopher Abanilla <christopher.abanilla@gmx.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  "pyproject.toml",
  "alembic.ini",
  ".gitignore",
  ".dockerignore",
  ".env.example",
  ".python-version",
  "entrypoint.sh",
