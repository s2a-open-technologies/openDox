services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: opendox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${SQL_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PASS:-postgres}
      POSTGRES_DB: ${SQL_DB:-opendox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-postgres} -d ${SQL_DB:-opendox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════════
  # Redis (Session Store)
  # ═══════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: opendox-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════════
  # Garage (S3-compatible object storage for persisted audio downloads)
  # ═══════════════════════════════════════════════════════════════════════════════
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: opendox-garage
    restart: always
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-a19c30166d07933f070e4a769eb3a9e05ae3d15c4fa7bcdb9ec3e983e3fe3bca}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-ChangeThisGarageAdminToken}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot idempotent setup: cluster layout, bucket, S3 access key.
  # Re-run on every `up`; exits 0 immediately if already configured.
  # `restart: on-failure` covers a transient race on the very first `up`
  # (garage's admin API/DNS not yet reachable the instant this container
  # starts) — init.sh now times out instead of waiting forever, and Compose
  # retries automatically instead of requiring a manual `down` + `up`.
  garage-init:
    build:
      context: ./garage/init
    container_name: opendox-garage-init
    restart: on-failure:5
    environment:
      GARAGE_HOST: garage
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-ChangeThisGarageAdminToken}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-a19c30166d07933f070e4a769eb3a9e05ae3d15c4fa7bcdb9ec3e983e3fe3bca}
      GARAGE_BUCKET: ${S3_BUCKET:-opendox-audio}
      GARAGE_KEY_ID: ${S3_ACCESS_KEY_ID:-GK000000000000000000000001}
      GARAGE_KEY_SECRET: ${S3_SECRET_ACCESS_KEY:-18c9004ef3b791ca07e7730f3ba4bdad038161d0f0c771255385c391ed18ed2a}
    depends_on:
      garage:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════════
  # Whisper Server (OpenAI-compatible API for transcription)
  # ═══════════════════════════════════════════════════════════════════════════════
  whisper:
    image: registry.nutsolution.de/opendox-whisper:0.1.0
    build:
      context: .
      dockerfile: whisper_server/Dockerfile
    container_name: opendox-whisper
    restart: always
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-loc-123}
      WHISPER_MAX_CONCURRENT_TRANSCRIPTIONS: ${WHISPER_MAX_CONCURRENT_TRANSCRIPTIONS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════════════════════════
  # Parakeet Server (CPU, onnx-asr, OpenAI-compatible API for live ASR)
  # ═══════════════════════════════════════════════════════════════════════════════
  parakeet:
    image: registry.nutsolution.de/opendox-parakeet:0.1.0
    build:
      context: .
      dockerfile: parakeet_server/Dockerfile
      args:
        DEVICE: ${PARAKEET_DEVICE:-gpu}
    container_name: opendox-parakeet
    restart: always
    environment:
      PARAKEET_MAX_CONCURRENT_DECODES: ${PARAKEET_MAX_CONCURRENT_DECODES:-2}
    # GPU access — the parakeet image defaults to the CUDA+cuDNN base and
    # uses CUDAExecutionProvider when a GPU is present. On CPU-only hosts
    # onnxruntime falls back to CPUExecutionProvider automatically, so this
    # deploy block can stay as-is; Docker simply ignores the device reservation.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═══════════════════════════════════════════════════════════════════════════════
  # openDox Application (FastAPI + React)
  # ═══════════════════════════════════════════════════════════════════════════════
  app:
    image: registry.nutsolution.de/opendox:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opendox-app
    restart: always
    ports:
      - "${APP_PORT:-20000}:5000"
    environment:
      # Database (service name as host inside Docker network)
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASS: ${SQL_PASS:-postgres}
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DB: ${SQL_DB:-opendox}
      # Database URI override (optional, bypasses SQL_* above)
      DATABASE_URI: ${DATABASE_URI:-}
      # Security / Auth
      SECRET_KEY: ${SECRET_KEY:-ChangeThisInProduction}
      ALGORITHM: ${ALGORITHM:-HS256}
      # Comma-separated list of trusted origins for CORS (e.g. the Apache
      # vhost's public URL). Empty = allow all origins (dev default).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # IPs allowed to set X-Forwarded-Proto/-Host (OIDC redirect URI).
      # Empty = auto-detect loopback + this container's Docker gateway.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Field Encryption (DSGVO / § 203 StGB)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Redis Session Store
      REDIS_URL: redis://redis:6379/0
      # Root path for sub-path deployment (e.g. /app)
      ROOT_PATH: ${ROOT_PATH:-}
      # S3-compatible object storage for persisted audio downloads (points at
      # the local `garage` service by default; swap to any S3-compatible
      # endpoint — Hetzner Object Storage, AWS S3, etc. — via .env)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-opendox-audio}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK000000000000000000000001}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-18c9004ef3b791ca07e7730f3ba4bdad038161d0f0c771255385c391ed18ed2a}
      S3_REGION: ${S3_REGION:-garage}
    volumes:
      - app-chunks:/app/chunks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_started
      garage-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: opendox-postgres-data
  redis-data:
    name: opendox-redis-data
  whisper-data:
    name: opendox-whisper-data
  garage-data:
    name: opendox-garage-data
  app-chunks:
    name: opendox-app-chunks
