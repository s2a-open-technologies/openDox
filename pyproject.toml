[project]
name = "project-red"
version = "0.1.0"
description = "Medical transcription platform with FastAPI backend and React frontend"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "crizz", email = "christopher.abanilla@gmx.de"},
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.2",
    "fastapi>=0.122.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.7",
    "ldap3>=2.9.1",
    "numpy>=2.3.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.38.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = false
