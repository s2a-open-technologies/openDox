[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = false

[tool.ruff]
# Setze die maximale Zeilenlänge
line-length = 88

[tool.ruff.lint]
# Wähle die Regeln aus:
# E/F = Pyflakes/Pycodestyle (Standard PEP8)
# I = Isort (Import-Sortierung)
# D = Pydocstyle (Docstrings)
select = ["E", "F", "I", "D"]
ignore = ["D107"] # Optional: Wenn du __init__ nicht immer dokumentieren willst

[tool.ruff.lint.per-file-ignores]
# Test function names are self-documenting; don't require docstrings on them.
"tests/**" = ["D103"]

# Konfiguration der Import-Sortierung
[tool.ruff.lint.isort]
# Definiere die Reihenfolge deiner Imports
known-first-party = ["dein_projektname"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Konfiguration für Google-Style Docstrings
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Ruff übernimmt hier die Arbeit von Black
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
