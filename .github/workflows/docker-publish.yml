name: Docker Publish (GHCR)

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Which images to build (app = backend + web UI only)"
        type: choice
        default: app
        options:
          - app
          - all
          - whisper
          - parakeet
          - garage-init

permissions:
  contents: read
  packages: write

jobs:
  select:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Filter the build matrix
        id: pick
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          cat > all.json <<'JSON'
          [
            {"group": "app", "name": "opendox", "dockerfile": "Dockerfile", "context": ".",
             "tag_suffix": "",
             "description": "openDox: medical transcription platform (backend and web UI)"},
            {"group": "garage-init", "name": "opendox-garage-init",
             "dockerfile": "garage/init/Dockerfile", "context": "./garage/init",
             "tag_suffix": "",
             "description": "openDox: one-shot setup of the bundled Garage S3 storage"},
            {"group": "whisper", "name": "opendox-whisper",
             "dockerfile": "whisper_server/Dockerfile", "context": ".",
             "device": "gpu", "tag_suffix": "",
             "description": "openDox: Whisper transcription server (faster-whisper, GPU)"},
            {"group": "whisper", "name": "opendox-whisper",
             "dockerfile": "whisper_server/Dockerfile", "context": ".",
             "device": "cpu", "tag_suffix": "cpu-",
             "description": "openDox: Whisper transcription server (faster-whisper, CPU)"},
            {"group": "parakeet", "name": "opendox-parakeet",
             "dockerfile": "parakeet_server/Dockerfile", "context": ".",
             "device": "gpu", "tag_suffix": "",
             "description": "openDox: Parakeet live transcription server (GPU)"},
            {"group": "parakeet", "name": "opendox-parakeet",
             "dockerfile": "parakeet_server/Dockerfile", "context": ".",
             "device": "cpu", "tag_suffix": "cpu-",
             "description": "openDox: Parakeet live transcription server (CPU)"}
          ]
          JSON
          matrix=$(jq -c --arg sel "$IMAGES" \
            '[.[] | select($sel == "all" or .group == $sel)]' all.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$matrix" | jq -r '[.[] | .name + ":" + (.device // "default")] | join(", ")')"

  build-and-push:
    name: ${{ matrix.name }} (${{ matrix.device || 'default' }})
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      # The Parakeet images bundle their ONNX model (several GB) and are built for two
      # platforms, which exceeds the free disk space of a standard runner
      # ("no space left on device" while exporting layers). Remove the preinstalled
      # toolchains this workflow does not need.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=$(python3 scripts/bump_version.py --current)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels (image config) and annotations (manifest + index) on every image:
      # `org.opencontainers.image.source` links the package to this repository on
      # GitHub; for a multi-arch image the index-level annotation is what the
      # package page reads. Tags stay explicit below.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=S2A Open Technologies gGmbH
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=S2A Open Technologies gGmbH
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.device && format('DEVICE={0}', matrix.device) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.device || 'default' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.device || 'default' }}
          provenance: true
          sbom: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.tag_suffix }}${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.tag_suffix }}latest

      # Voluntary SBOM per image (CycloneDX JSON), pinned to the exact pushed
      # manifest digest. Not a CRA obligation for non-commercial AGPL use, but
      # a ready-made artifact for audits / hospital procurement questions.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.name }}-${{ matrix.tag_suffix || 'gpu-' }}${{ steps.version.outputs.version }}.cdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
