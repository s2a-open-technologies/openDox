version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-dev:
        dependency-type: development
      pip-prod:
        dependency-type: production
    ignore:
      # sqlmodel >= 0.0.47 binds datetime columns to a UTC-only type that
      # rejects naive datetimes; the backend still writes datetime.utcnow().
      # Lift this once all datetimes are timezone-aware.
      - dependency-name: "sqlmodel"
        versions: [">=0.0.47"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /parakeet_server
    schedule:
      interval: weekly
    groups:
      parakeet:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /whisper_server
    schedule:
      interval: weekly
    groups:
      whisper:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
      npm-prod:
        dependency-type: production
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3